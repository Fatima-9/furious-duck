services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: furious_duck_prometheus_preprod
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=https://preprod.dsp5-archi-o24a-g2.fr/prometheus"
      - "--web.route-prefix=/prometheus"
    volumes:
      - /home/thetiptop_gp2/furious-duck/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_preprod:/prometheus
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.prometheus-preprod.rule=(Host(`preprod.dsp5-archi-o24a-g2.fr`) || Host(`preprod.dsp5-archi-o24a-g2.com`)) && (Path(`/prometheus`) || PathPrefix(`/prometheus/`))"
      - "traefik.http.routers.prometheus-preprod.priority=1000"
      - "traefik.http.routers.prometheus-preprod.entrypoints=websecure"
      - "traefik.http.routers.prometheus-preprod.tls=true"
      - "traefik.http.routers.prometheus-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus-preprod.loadbalancer.server.port=9090"
  grafana:
    image: grafana/grafana:11.3.0
    container_name: furious_duck_grafana_preprod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://preprod.dsp5-archi-o24a-g2.fr/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data_preprod:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Monte hors de /var/lib/grafana : ce chemin est deja occupe par le
      # volume grafana_data_preprod, et imbriquer un bind mount dedans depend
      # de l'ordre de montage de docker. Le chemin doit correspondre a
      # options.path du provider.
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.grafana-preprod.rule=(Host(`preprod.dsp5-archi-o24a-g2.fr`) || Host(`preprod.dsp5-archi-o24a-g2.com`)) && (Path(`/grafana`) || PathPrefix(`/grafana/`))"
      - "traefik.http.routers.grafana-preprod.priority=1000"
      - "traefik.http.routers.grafana-preprod.entrypoints=websecure"
      - "traefik.http.routers.grafana-preprod.tls=true"
      - "traefik.http.routers.grafana-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana-preprod.loadbalancer.server.port=3000"
    depends_on:
      - prometheus

  # Calcule les quatre metriques DORA a partir de l'API Jenkins et les expose
  # au format Prometheus. Jenkins tourne dans un projet compose separe : on le
  # joint par son nom de conteneur sur le reseau partage traefik_proxy.
  dora-exporter:
    build: ./dora-exporter
    container_name: furious_duck_dora_exporter_preprod
    restart: unless-stopped
    environment:
      # Jenkins est servi derriere --prefix=/jenkins : le prefixe fait partie
      # de l'URL de l'API, sans lui Jenkins repond 404.
      - JENKINS_URL=${DORA_JENKINS_URL:-http://furious_duck_jenkins:8080/jenkins}
      - JENKINS_JOB_PATH=${DORA_JENKINS_JOB_PATH:-job/furious-duck/job/PREPROD}
      - JENKINS_USER=${DORA_JENKINS_USER:-}
      - JENKINS_TOKEN=${DORA_JENKINS_TOKEN:-}
      - DORA_WINDOW_DAYS=${DORA_WINDOW_DAYS:-30}
    networks:
      - default
      - traefik_proxy
    # Pas de label traefik : les metriques restent internes, Prometheus les
    # scrape par le reseau docker.


volumes:
  prometheus_data_preprod:
  grafana_data_preprod:

networks:
  traefik_proxy:
    external: true
