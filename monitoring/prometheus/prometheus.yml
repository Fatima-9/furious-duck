global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: furious-duck-backend-preprod
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:5000

  # --- Metriques DORA -------------------------------------------------------
  # L'exporter interroge l'API Jenkins et met ses resultats en cache 60 s :
  # un scrape frequent ne surcharge donc pas Jenkins.
  - job_name: dora
    metrics_path: /metrics
    static_configs:
      - targets:
          - dora-exporter:9110
    relabel_configs:
      - target_label: instance
        replacement: dora-preprod
