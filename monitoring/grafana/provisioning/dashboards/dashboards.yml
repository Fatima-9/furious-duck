apiVersion: 1

providers:
  - name: "furious-duck"
    orgId: 1
    folder: "Furious Duck"
    type: file
    # Les dashboards sont versionnes dans le depot : on empeche leur
    # suppression depuis l'interface, sinon un clic malheureux les perdrait
    # jusqu'au prochain redemarrage de Grafana.
    disableDeletion: true
    # Recharge automatiquement les fichiers modifies (utile apres un git pull
    # suivi d'un simple restart du conteneur).
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
