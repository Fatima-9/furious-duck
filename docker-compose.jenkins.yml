services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: furious_duck_jenkins
    restart: unless-stopped
    user: root
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.jenkins-preprod.rule=(Host(`preprod.dsp5-archi-o24a-g2.fr`) || Host(`preprod.dsp5-archi-o24a-g2.com`)) && (Path(`/jenkins`) || PathPrefix(`/jenkins/`))"
      - "traefik.http.routers.jenkins-preprod.priority=1000"
      - "traefik.http.routers.jenkins-preprod.entrypoints=websecure"
      - "traefik.http.routers.jenkins-preprod.tls=true"
      - "traefik.http.routers.jenkins-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.services.jenkins-preprod.loadbalancer.server.port=8080"

volumes:
  jenkins_home:

networks:
  traefik_proxy:
    external: true
