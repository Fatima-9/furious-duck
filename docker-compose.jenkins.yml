services:
  jenkins:
    build:
      context: ./jenkins
    container_name: furious_duck_jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
    name: jenkins_home
