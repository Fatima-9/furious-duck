services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: furious_duck_prometheus_prod
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=https://dsp5-archi-o24a-g2.fr/prometheus"
      - "--web.route-prefix=/prometheus"
    volumes:
      - ${VM_PROJECT_DIR:-/home/thetiptop_gp2/furious-duck}/monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.prometheus-prod.rule=(Host(`dsp5-archi-o24a-g2.fr`) || Host(`dsp5-archi-o24a-g2.com`)) && (Path(`/prometheus`) || PathPrefix(`/prometheus/`))"
      - "traefik.http.routers.prometheus-prod.priority=1000"
      - "traefik.http.routers.prometheus-prod.entrypoints=websecure"
      - "traefik.http.routers.prometheus-prod.tls=true"
      - "traefik.http.routers.prometheus-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus-prod.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: furious_duck_grafana_prod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD est requis}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://dsp5-archi-o24a-g2.fr/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ${VM_PROJECT_DIR:-/home/thetiptop_gp2/furious-duck}/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ${VM_PROJECT_DIR:-/home/thetiptop_gp2/furious-duck}/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ${VM_PROJECT_DIR:-/home/thetiptop_gp2/furious-duck}/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.grafana-prod.rule=(Host(`dsp5-archi-o24a-g2.fr`) || Host(`dsp5-archi-o24a-g2.com`)) && (Path(`/grafana`) || PathPrefix(`/grafana/`))"
      - "traefik.http.routers.grafana-prod.priority=1000"
      - "traefik.http.routers.grafana-prod.entrypoints=websecure"
      - "traefik.http.routers.grafana-prod.tls=true"
      - "traefik.http.routers.grafana-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana-prod.loadbalancer.server.port=3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: furious_duck_node_exporter_prod
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)"
      - "--collector.netdev.device-exclude=^(veth|docker|br-|lo).*$$"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - default

  dora-exporter:
    build: ./dora-exporter
    container_name: furious_duck_dora_exporter_prod
    restart: unless-stopped
    environment:
      - JENKINS_URL=${DORA_JENKINS_URL:-http://furious_duck_jenkins:8080/jenkins}
      - JENKINS_JOB_PATH=${DORA_JENKINS_JOB_PATH:-job/furious-duck/job/main}
      - DORA_ENVIRONMENT=${DORA_ENVIRONMENT:-prod}
      - JENKINS_USER=${DORA_JENKINS_USER:-}
      - JENKINS_TOKEN=${DORA_JENKINS_TOKEN:-}
      - DORA_WINDOW_DAYS=${DORA_WINDOW_DAYS:-30}
    networks:
      - default
      - traefik_proxy

volumes:
  prometheus_data_prod:
  grafana_data_prod:

networks:
  traefik_proxy:
    external: true
