services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.live
    restart: unless-stopped
    volumes: !reset []
    ports: !override []
    environment:
      NODE_ENV: production
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.backend-preprod.rule=(Host(`preprod.dsp5-archi-o24a-g2.fr`) || Host(`preprod.dsp5-archi-o24a-g2.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-preprod.priority=300"
      - "traefik.http.routers.backend-preprod.entrypoints=websecure"
      - "traefik.http.routers.backend-preprod.tls=true"
      - "traefik.http.routers.backend-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-preprod.loadbalancer.server.port=5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.live
    restart: unless-stopped
    volumes: !reset []
    ports: !override []
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.frontend-preprod.rule=Host(`preprod.dsp5-archi-o24a-g2.fr`) || Host(`preprod.dsp5-archi-o24a-g2.com`)"
      - "traefik.http.routers.frontend-preprod.priority=1"
      - "traefik.http.routers.frontend-preprod.entrypoints=websecure"
      - "traefik.http.routers.frontend-preprod.tls=true"
      - "traefik.http.routers.frontend-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-preprod.loadbalancer.server.port=80"

networks:
  traefik_proxy:
    external: true
