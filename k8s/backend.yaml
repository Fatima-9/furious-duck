apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: furious-duck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: furious-duck-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "development"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_EXPIRES_IN
            - name: RESET_TOKEN_EXPIRES_IN_MINUTES
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: RESET_TOKEN_EXPIRES_IN_MINUTES
            - name: DEFAULT_USER_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DEFAULT_USER_ROLE_ID
            - name: DEFAULT_BOUTIQUE_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DEFAULT_BOUTIQUE_ID
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: FACEBOOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FACEBOOK_APP_ID
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: furious-duck
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
