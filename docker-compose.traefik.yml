services:
  traefik:
    image: traefik:v3.6.2
    container_name: furious_duck_traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - "--api.dashboard=true"
      - "--api.basePath=/traefik"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=thetiptop.gp2@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro

    networks:
      - traefik_proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-preprod.rule=(Host(`preprod.dsp5-archi-o24a-g2.fr`) || Host(`preprod.dsp5-archi-o24a-g2.com`)) && PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik-preprod.priority=600"
      - "traefik.http.routers.traefik-preprod.entrypoints=websecure"
      - "traefik.http.routers.traefik-preprod.tls=true"
      - "traefik.http.routers.traefik-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-preprod.service=api@internal"
      - "traefik.http.routers.traefik-preprod.middlewares=traefik-preprod-auth"
      - "traefik.http.middlewares.traefik-preprod-auth.basicauth.users=admin:$$2y$$05$$xdEuLs25YdFfFZ6gZVZemeFea2VHE4k6FeV1SOIvOkpj3TmFZq4qC"

volumes:
  traefik_letsencrypt:

networks:
  traefik_proxy:
    external: true
