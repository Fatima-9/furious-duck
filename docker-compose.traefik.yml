services:
  traefik:
    image: traefik:v3.6.2
    container_name: furious_duck_traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - "--api.dashboard=true"
      - "--api.basePath=/traefik"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Entrypoint interne dedie aux metriques. Il n'est pas publie dans
      # ports: donc il reste inaccessible depuis l'exterieur ; seul Prometheus
      # l'atteint via le reseau docker traefik_proxy.
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      # Labels indispensables pour distinguer le trafic HTTPS (entrypoint
      # websecure) du HTTP, et pour ventiler par service et par code retour.
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # Buckets de latence adaptes a une application web : la valeur par defaut
      # de Traefik (0.1/0.3/1.2/5) est trop grossiere en dessous de 100 ms.
      - "--metrics.prometheus.buckets=0.05,0.1,0.25,0.5,1,2.5,5,10"
      # Journal des acces HTTPS, au format JSON pour etre exploitable.
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      # Le champ Authorization est retire : les logs ne doivent pas contenir
      # de jetons ni d'identifiants.
      - "--accesslog.fields.headers.names.Authorization=drop"
      - "--accesslog.fields.headers.names.Cookie=drop"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=thetiptop.gp2@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_logs:/var/log/traefik

    networks:
      - traefik_proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-preprod.rule=(Host(`preprod.dsp5-archi-o24a-g2.fr`) || Host(`preprod.dsp5-archi-o24a-g2.com`)) && PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik-preprod.priority=600"
      - "traefik.http.routers.traefik-preprod.entrypoints=websecure"
      - "traefik.http.routers.traefik-preprod.tls=true"
      - "traefik.http.routers.traefik-preprod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-preprod.service=api@internal"
      - "traefik.http.routers.traefik-preprod.middlewares=traefik-preprod-auth"
      - "traefik.http.middlewares.traefik-preprod-auth.basicauth.users=admin:$$2y$$05$$xdEuLs25YdFfFZ6gZVZemeFea2VHE4k6FeV1SOIvOkpj3TmFZq4qC"

volumes:
  traefik_letsencrypt:
  traefik_logs:

networks:
  traefik_proxy:
    external: true
